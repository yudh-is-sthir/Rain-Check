version: '3.8'

services:
  # --- INFRASTRUCTURE ---
  redis:
    image: redis:alpine
    container_name: rain-check-redis
    ports:
      - "6379:6379"
    restart: always

  # --- MICROSERVICES ---
  auth-service:
    build: 
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: rain-check-auth
    environment:
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./services/auth-service/data:/app/data

  weather-service:
    build: 
      context: ./services/weather-service
      dockerfile: Dockerfile
    container_name: rain-check-weather
    environment:
      - PORT=3002
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=redis://redis:6379
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    depends_on:
      - redis

  # --- GATEWAY ---
  gateway:
    image: nginx:alpine
    container_name: rain-check-gateway
    ports:
      - "3000:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./public:/usr/share/nginx/html
    depends_on:
      - auth-service
      - weather-service
